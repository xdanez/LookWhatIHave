name: Build and Add to Release

on:
  create:
    tag:
      - 'release-*'

jobs:
  update-build-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@v5

      - name: Gradle Build
        run: ./gradlew build

      - name: set release version variable
        id: vars
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/release-}" >> $GITHUB_ENV

      - name: create or update release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_VERSION }}
          files: build/libs/LookWhatIHave-${{ env.RELEASE_VERSION }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}